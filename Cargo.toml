[package]
name = "plaind"
version = "0.1.0"
edition = "2021"
description = "Companion daemon for the Plain phone's Dev plugin — a shell, screen mirror and process list over one TCP socket."
license = "MIT"

[[bin]]
name = "plaind"
path = "src/main.rs"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
rmpv = "1"
sysinfo = "0.33"
portable-pty = "0.8"
base64 = "0.22"
rand = "0.8"
qrcode = { version = "0.14", default-features = false }
dirs = "5"
local-ip-address = "0.6"
anyhow = "1"
image = { version = "0.25", default-features = false, optional = true }
fast_image_resize = { version = "5", optional = true }
jpeg-encoder = { version = "0.6", default-features = false, features = ["simd"], optional = true }
xcap = { version = "0.0.14", optional = true }
enigo = { version = "0.3", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_Foundation", "Win32_System_Console"] }
tray-icon = "0.19"

[features]
default = ["screen", "input"]
screen = ["dep:xcap", "dep:image", "dep:fast_image_resize", "dep:jpeg-encoder"]
input = ["dep:enigo"]

[profile.release]
strip = true
lto = true
